<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.jsdelivr.net/gh/fathur-md/ppw@main/assets/img/gemini-svg.png"
    />
    <link
      rel="apple-touch-icon"
      type="image/png"
      href="https://cdn.jsdelivr.net/gh/fathur-md/ppw@main/assets/img/gemini-svg.png"
      sizes="180x180"
    />
    <title>Paket - FathurNEWS</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header>
      <nav id="navbar"></nav>
    </header>

    <section id="page-services" class="container fade-in hidden">
      <div style="text-align: center; padding: 4rem 0">
        <h1 style="font-size: 3rem">Dukung Jurnalisme Kami</h1>
        <p style="color: var(--text-secondary)">Pilih paket yang sesuai</p>

        <div class="pricing-grid">
          <!-- FREE -->
          <div class="price-card">
            <h4>Pembaca Umum</h4>
            <p class="price-amount">Gratis</p>

            <ul class="feature-list">
              <li>✓ 5 Berita Premium</li>
              <li>✓ Akses Berita Utama</li>
              <li>✓ Newsletter</li>
            </ul>

            <button class="btn-action">DAFTAR GRATIS</button>
          </div>

          <!-- PREMIUM -->
          <div class="price-card premium">
            <span class="card-badge">Populer</span>

            <h4>FathurNEWS+</h4>
            <p class="price-amount">Rp 29rb / bln</p>

            <ul class="feature-list">
              <li>✓ Tanpa Batas</li>
              <li>✓ Investigasi Eksklusif</li>
              <li>✓ Tanpa Iklan</li>
              <li>✓ Offline Mode</li>
            </ul>

            <button class="btn-action">BERLANGGANAN</button>
          </div>
        </div>
      </div>
    </section>

    <footer>© 2026 FathurNEWS</footer>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
