<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.jsdelivr.net/gh/fathur-md/ppw@main/assets/img/gemini-svg.png"
    />
    <link
      rel="apple-touch-icon"
      type="image/png"
      href="https://cdn.jsdelivr.net/gh/fathur-md/ppw@main/assets/img/gemini-svg.png"
      sizes="180x180"
    />

    <title>FathurNEWS | Informasi Akurat & Terpercaya</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header>
      <nav id="navbar"></nav>
    </header>
    <main style>
      <section class="fade-in container" style="padding: 120px 1rem 1rem 1rem">
        <div class="headline-grid">
          <div class="main-article">
            <img
              src="https://images.unsplash.com/photo-1677442136019-21780ecad995"
              alt="Headline"
            />
            <div class="article-overlay">
              <span class="badge">Teknologi</span>
              <h2>Perkembangan AI Semakin Pesat di Industri Global</h2>
            </div>
          </div>

          <div class="sidebar">
            <h3>Paling Dicari</h3>
            <div class="list" id="headline"></div>
          </div>
        </div>

        <div style="margin-top: 4rem">
          <h3
            style="
              font-size: 2rem;
              font-weight: 800;
              letter-spacing: -0.04em;
              margin-bottom: 2.5rem;
            "
          >
            Berita Terbaru
          </h3>
          <div class="news-grid" id="news-grid"></div>
        </div>
      </section>
    </main>

    <footer>
      <div
        class="container"
        style="
          margin-top: 4rem;
          padding-top: 2rem;
          border-top: 1px solid var(--border-color);
        "
      >
        <p
          style="
            font-size: 10px;
            font-weight: 800;
            color: #ccc;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            text-align: center;
          "
        >
          &copy; 2024 FATHURNEWS MEDIA. ESTETIKA & AKURASI.
        </p>
      </div>
    </footer>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
