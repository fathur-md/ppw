<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.jsdelivr.net/gh/fathur-md/ppw@main/assets/img/gemini-svg.png"
    />
    <link
      rel="apple-touch-icon"
      type="image/png"
      href="https://cdn.jsdelivr.net/gh/fathur-md/ppw@main/assets/img/gemini-svg.png"
      sizes="180x180"
    />

    <title>FathurNEWS | Informasi Akurat & Terpercaya</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <header>
      <nav id="navbar"></nav>
    </header>

    <section class="fade-in">
      <div class="hero">
        <img
          src="https://images.unsplash.com/photo-1504711432869-efd597cdd04d"
        />
        <h1>Evolusi Jurnalisme Digital</h1>
      </div>

      <div id="news" class="grid"></div>
    </section>

    <footer>
      <div
        class="container"
        style="
          margin-top: 4rem;
          padding-top: 2rem;
          border-top: 1px solid var(--border-color);
        "
      >
        <p
          style="
            font-size: 10px;
            font-weight: 800;
            color: #ccc;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            text-align: center;
          "
        >
          &copy; 2024 FATHURNEWS MEDIA. ESTETIKA & AKURASI.
        </p>
      </div>
    </footer>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
