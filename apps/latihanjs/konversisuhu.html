<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Konversi Suhu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header id="header" class="app-header">
  </header>

  <div class="app-container animate-fade-in" style="margin-top: 3rem; width: 100%;">
    <div class="convert-content">
      <h2>Konversi Suhu</h2>

      <label for="suhu">Masukkan Suhu:</label>
      <input type="number" id="suhu" placeholder="Contoh: 25" />

      <label for="jenis">Jenis Konversi:</label>
      <div class="select-wrapper">
        <select id="jenis">
          <option value="CtoF">Celsius ke Fahrenheit</option>
          <option value="FtoC">Fahrenheit ke Celsius</option>
        </select>
      </div>

      <button id="btn-konversi">Konversi</button>


      <div id="output" class="output"></div>

    </div>
  </div>


  <script>
    const output = document.getElementById("output");
    const btn = document.getElementById("btn-konversi");

    btn.addEventListener("click", konversiSuhu);

    function konversiSuhu() {
      const suhuInput = parseFloat(document.getElementById("suhu").value);
      const jenisKonversi = document.getElementById("jenis").value;

      let hasil = "";

      if (isNaN(suhuInput)) {
        hasil = "Masukkan angka suhu yang valid.";
      } else if (jenisKonversi === "CtoF") {
        hasil = `${suhuInput}˚C = ${((suhuInput * 9 / 5) + 32).toFixed(2)}˚F`;
      } else {
        hasil = `${suhuInput}˚F = ${((suhuInput - 32) * 5 / 9).toFixed(2)}˚C`;
      }

      output.innerHTML = `
        <div class="output-result">
          <span>* Hasil</span>
          <p>${hasil}</p>  
        </div>
      `;

      output.classList.add("output-show");
    }

  </script>
  <script type="module" src="main.js"></script>
</body>

</html>
