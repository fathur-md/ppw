<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Rental</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a href="../../index.html" style="position: fixed; bottom: 0">
      <button
        style="
          padding: 10px 20px;
          border-radius: 30px;
          border: none;
          background: rgb(81, 126, 198);
          color: white;
          font-size: 16px;
          cursor: pointer;
          box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
          transition:
            background 0.3s,
            transform 0.3s;
        "
      >
        ← Kembali
      </button>
    </a>
    <nav>
      <div class="nav-child">
        <a href="#" style="font-weight: bold">
          CAR<span style="font-weight: 300; color: rgb(189, 63, 18)"
            >Rental</span
          >
        </a>
        <ul>
          <li><a href="#cars">Cars</a></li>
          <li><a href="#">About Us</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>
    </nav>

    <div id="search">
      <div class="title">
        <h1>Car Rental</h1>
        <p>Find the perfect car for your next adventure</p>
        <hr />
      </div>
      <div class="form-container">
        <div class="form-group">
          <label for="pickup">Rental Location:</label>
          <select id="pickup" name="pickup">
            <option value="">Select Location</option>
            <option value="location1">Yogyakarta</option>
            <option value="location2">Bali</option>
          </select>
        </div>
        <div class="form-group">
          <label for="pickup-date">Rental Start Date:</label>
          <input type="date" id="pickup-date" name="pickup-date" />
        </div>
        <div class="form-group">
          <label for="return-date">Rental End Date:</label>
          <input type="date" id="return-date" name="return-date" />
        </div>
        <button type="submit">Search</button>
      </div>
    </div>

    <div id="cars" class="car-list">
      <h2>Car List</h2>
      <div class="car-item">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRVHg8Kp3U40aawoUhYhRSKsqtjtyMiD_vig&s"
          alt="Car 1"
        />
        <h3>Avanza</h3>
        <p>Kapasitas 6 orang</p>
        <span>250.000</span>
        <button>Pesan</button>
      </div>
      <div class="car-item">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRa9tb3Pk54pWAh7cWbkQQGE1G77ba1jtFzkA&s"
          alt="Car 2"
        />
        <h3>Innova</h3>
        <p>Kapasitas 8 orang</p>
        <span>350.000</span>
        <button>Pesan</button>
      </div>
      <div class="car-item">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRazflS_nbKT27zZR8q2qA7dT-NpGkZmrHzoA&s"
          alt="Car 2"
        />
        <h3>Fortuner</h3>
        <p>Kapasitas 8 orang</p>
        <span>450.000</span>
        <button>Pesan</button>
      </div>
      <div class="car-item">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQuXnNDU1WJqhQZNKu-6ublhsUkebEsalf3uA&s"
          alt="Car 2"
        />
        <h3>Toyota 86</h3>
        <p>Kapasitas 2 orang</p>
        <span>700.000</span>
        <button>Pesan</button>
      </div>
    </div>
  </body>
</html>
