<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="https://cdn.jsdelivr.net/gh/fathur-md/ppw@main/assets/img/gemini-svg.png"
    />
    <link
      rel="apple-touch-icon"
      type="image/png"
      href="https://cdn.jsdelivr.net/gh/fathur-md/ppw@main/assets/img/gemini-svg.png"
      sizes="180x180"
    />
    <title>Fathurrahaman | Portfolio</title>
    <link rel="stylesheet" href="../../assets/css/output.css" />
  </head>

  <body
    class="antialiased flex flex-col min-h-dvh bg-background text-foreground font-sans"
  >
    <div id="global-navbar"></div>
    <nav
      class="sticky top-2 z-40 w-fit mx-auto px-2 py-1 flex items-center border border-border-glass rounded-full bg-card-bg font-medium backdrop-blur-xl shadow-glass-inner mt-2"
    >
      <a
        href="#"
        data-route="home"
        class="nav-btn text-sm px-4 py-1.5 rounded-full text-muted hover:text-foreground transition-colors"
        >Home</a
      >
      <a
        href="#"
        data-route="projects"
        class="nav-btn text-sm px-4 py-1.5 rounded-full text-muted hover:text-foreground transition-colors"
        >Projects</a
      >
      <a
        href="#"
        data-route="about"
        class="nav-btn text-sm px-4 py-1.5 rounded-full text-muted hover:text-foreground transition-colors"
        >About</a
      >
      <a
        href="#"
        data-route="contact"
        class="nav-btn text-sm px-4 py-1.5 rounded-full text-muted hover:text-foreground transition-colors"
        >Contact</a
      >
    </nav>
    <main
      id="app-root"
      class="grow flex flex-col px-6 md:px-12 max-w-7xl mx-auto w-full py-12 relative isolate"
    ></main>

    <footer
      class="mt-auto border-t border-border-glass py-2 shadow-glass-inner bg-card-bg/50 backdrop-blur-md"
    >
      <div class="max-w-6xl mx-auto px-6 text-center">
        <small class="text-muted font-medium">
          &copy; 2026 Muhammad Fathurrahman. All rights reserved.
        </small>
      </div>
    </footer>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
