<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/img/gemini-svg.svg"
      sizes="32x32"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../assets/img/gemini-svg.svg"
      sizes="192x192"
    />
    <link
      rel="apple-touch-icon"
      href="https://raw.githubusercontent.com/fathur-md/ppw/refs/heads/main/assets/img/gemini-svg.png"
      sizes="180x180"
    />
    <link rel="stylesheet" href="../assets/css/shared.css" />
    <link rel="stylesheet" href="../assets/css/projects.css" />
    <title>FathurDEV • Projects</title>
  </head>
  <body class="projects-body">
    <!--
      TODO: Ubah atribut `href` agar menggunakan relative path yang sesuai untuk deployment GitHub Pages.
    -->
    <nav class="navbar">
      <a href="../" class="nav-link">Home</a>
      <a href="../portfolio/" class="nav-link">Portfolio</a>
      <a href="../projects/" class="nav-link">Projects</a>
      <a href="../about/" class="nav-link">About</a>
      <a href="../portfolio/#contact" class="nav-link">Contact</a>
    </nav>

    <main class="container">
      <section class="section container">
        <h1 class="section-title">Projects.</h1>
        <p class="text-muted">
          A collection of classwork, experiments, and academic milestones.
        </p>
      </section>
      <div class="projects-container" id="project-list"></div>
    </main>
    <footer class="footer">
      <p>Copyright © 2026 Muhammad Fathurrahman. All rights reserved.</p>
    </footer>
    <script>
      fetch("projects.json")
        .then((res) => res.json())
        .then((data) => {
          const container = document.getElementById("project-list");
          container.innerHTML = data
            .map(
              (item) => `
      <a href="${item.link}" class="projects-card">
        <div class="card-header">
          <span class="materi-kode">${item.kode}</span>
          <span class="materi-tanggal">${item.tahun}</span>
        </div>
        <h2 class="card-title">${item.judul}</h2>
        <p class="card-desc">${item.desc}</p>
        <div class="card-footer">
          <span class="tech-badge">${item.badge}</span>
        </div>
      </a>
    `,
            )
            .join("");
        });
    </script>
  </body>
</html>
